[project]
name = "vkr_dashboards"
authors = [{ name = "VKR Holdings", email = "lubaina@vkrholdings.com" }]
description = "Sales, Purchase, Stock and HR dashboards for ERPNext / Frappe HR v16"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
erpnext = ">=16.0.0-dev,<17.0.0"
